<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Crawler: i motori di ricerca indicizzano; chi raccoglie contenuti per
         addestrare modelli di IA trova noai/noimageai. Un robots.txt qui non
         servirebbe, perche' i crawler lo cercano solo alla radice del dominio;
         e un bot malevolo ignora entrambi, quindi non e' una difesa. -->
    <meta name="robots" content="index, follow, noai, noimageai" />
    <title>Nicholas Arcari - Portfolio</title>
    <meta name="description" content="Il portfolio di Nicholas Arcari, studente di Laurea Magistrale in Cybersecurity alla Sapienza: progetti di sicurezza, sviluppo software, appunti e homework dei corsi." />
    <link rel="canonical" href="https://nicholas-arcari.github.io/portfolio-nicholas/" />
    <!-- L'anteprima di un link al sito su LinkedIn, WhatsApp, Telegram e simili.
         Le app che la creano non eseguono JavaScript: leggono solo questi tag,
         con indirizzi completi. L'immagine e' public/images/og-image.jpg. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nicholas Arcari" />
    <meta property="og:title" content="Nicholas Arcari - Portfolio" />
    <meta property="og:description" content="Studente di Laurea Magistrale in Cybersecurity alla Sapienza: progetti di sicurezza, sviluppo software, appunti e homework dei corsi." />
    <meta property="og:url" content="https://nicholas-arcari.github.io/portfolio-nicholas/" />
    <meta property="og:image" content="https://nicholas-arcari.github.io/portfolio-nicholas/images/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nicholas Arcari, portfolio di cybersecurity" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="/assets/css/fontawesome-all.min.css" />
    <link rel="stylesheet" href="/assets/css/main.css" />

    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
  </head>
  <body class="homepage is-preload">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
